<!DOCTYPE html>
<html>
<head>
    <title>User App</title>
</head>
<body>
    <h2>Add User</h2>
    <form method="POST">
        <input type="text" name="name" required>
        <button type="submit">Add</button>
    </form>

    <h2>Users</h2>
    <ul>
        {% for user in users %}
            <li>{{ user[1] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
